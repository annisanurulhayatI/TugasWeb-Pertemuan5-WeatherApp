<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="weather-app">
        <h1>Weather App</h1>
        <p class="subtitle">Cari informasi cuaca berdasarkan kota</p>

        <form id="searchForm">
            <input
                type="text"
                id="cityInput"
                placeholder="Masukkan nama kota..."
                required
            >
            <button type="submit">Cari</button>
        </form>

        <div class="unit-toggle">
            <button id="celsiusBtn" class="unit-active">°C</button>
            <button id="fahrenheitBtn">°F</button>
        </div>

        <p id="loading">Memuat data cuaca...</p>
        <p id="error"></p>

        <section id="weatherResult">
            <h2 id="cityName"></h2>

            <img id="weatherIcon" src="" alt="Ikon cuaca">

            <p id="temperature"></p>
            <p id="description"></p>
            <p id="humidity"></p>
        </section>

        <section class="forecast">
            <h3>5-Day Forecast</h3>
            <div id="forecastList"></div>
        </section>

        <section class="history">
            <h3>Riwayat Pencarian</h3>
            <div id="historyList"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
